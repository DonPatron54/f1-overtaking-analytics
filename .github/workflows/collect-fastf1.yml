# Collects FastF1 race data with the team's F1 TV account (repository secrets
# F1_USERNAME / F1_PASSWORD) and commits the raw data after every season.
# Started manually: Actions -> "Collect FastF1 data" -> Run workflow.
name: Collect FastF1 data

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons, separated by spaces"
        required: true
        default: "2018 2019 2020 2023 2024 2025 2026"
      check_only:
        description: "Only check data access (HTTP status per season), collect nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect-fastf1
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect season by season (paced to the API limits)
        env:
          F1_USERNAME: ${{ secrets.F1_USERNAME }}
          F1_PASSWORD: ${{ secrets.F1_PASSWORD }}
          SEASONS: ${{ inputs.seasons }}
        run: |
          if [ -z "$F1_USERNAME" ] || [ -z "$F1_PASSWORD" ]; then
            echo "::error::Repository secrets F1_USERNAME and F1_PASSWORD are required"; exit 1
          fi
          if [ "${{ inputs.check_only }}" = "true" ]; then
            python -m src.collect_fastf1 --check $SEASONS
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for season in $SEASONS; do
            if ! [[ "$season" =~ ^20[0-9]{2}$ ]]; then echo "invalid season: $season"; exit 1; fi
            echo "::group::Season $season"
            python -m src.collect_fastf1 "$season"
            echo "::endgroup::"
            git add data/raw/fastf1 reports/logs/collection_fastf1.csv
            if ! git diff --cached --quiet; then
              git commit -m "Raw data FastF1 $season"
              git pull --rebase -q origin "$GITHUB_REF_NAME"
              git push -q origin "HEAD:$GITHUB_REF_NAME"
            fi
          done
